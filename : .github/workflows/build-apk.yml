
name: AKKITECH Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Source ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          test -n "$ZIP" || { echo "Source ZIP missing"; exit 1; }
          mkdir source
          unzip -q "$ZIP" -d source
          PROJECT=$(find source -name package.json -not -path '*/node_modules/*' | head -n 1)
          test -n "$PROJECT" || { echo "package.json missing"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build React Web App
        run: |
          cd "$PROJECT_DIR"
          npm install
          npm run build
          test -d dist || { echo "Vite dist folder missing"; exit 1; }

      - name: Create Capacitor Android Project
        run: |
          mkdir android-wrapper
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6
          mkdir www
          cp -a "$GITHUB_WORKSPACE/$PROJECT_DIR/dist/." www/
          echo '{"appId":"com.akkitech.buildlab","appName":"AKKITECH BUILD LAB","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Compile APK
        run: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Real APK
        uses: actions/upload-artifact@v4
        with:
          name: AKKITECH-BUILD-LAB-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
